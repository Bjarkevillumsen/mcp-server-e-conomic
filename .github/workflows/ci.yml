name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-stage1']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  stage1-release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-stage1')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', '' -replace '-stage1$', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Stage 1 release tag.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'
      - uses: actions/upload-artifact@v4
        with:
          name: EconomicMcp-Stage1-${{ steps.version.outputs.value }}
          path: artifacts/EconomicMcp-Stage1-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
      - name: Publish GitHub release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "artifacts/EconomicMcp-Stage1-${{ steps.version.outputs.value }}.zip"
          $ErrorActionPreference = 'Continue'
          gh release view $env:GITHUB_REF_NAME 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --title $env:GITHUB_REF_NAME --generate-notes
          }
