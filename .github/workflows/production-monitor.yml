name: Production endpoint monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-endpoint-monitor
  cancel-in-progress: true

jobs:
  mcp-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MCP_BASE_URL: https://mcp.squaremeter.dk
    steps:
      - name: Verify public health, OAuth metadata, auth boundary, CORS, and headers
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail --silent --show-error \
            --dump-header "$workdir/headers" \
            --output "$workdir/health" \
            "$MCP_BASE_URL/healthz"
          test "$(tr -d '\r\n ' < "$workdir/health")" = '{"status":"ok"}'
          grep -qi '^strict-transport-security: max-age=31536000' "$workdir/headers"
          grep -qi '^x-content-type-options: nosniff' "$workdir/headers"

          curl --fail --silent --show-error \
            --output "$workdir/metadata" \
            "$MCP_BASE_URL/.well-known/oauth-protected-resource"
          grep -q 'authorization_servers' "$workdir/metadata"

          auth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' "$MCP_BASE_URL/mcp")"
          test "$auth_status" = '401'

          cors_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header 'Origin: https://evil.example' \
            --header 'Access-Control-Request-Method: POST' "$MCP_BASE_URL/mcp")"
          test "$cors_status" = '403'
